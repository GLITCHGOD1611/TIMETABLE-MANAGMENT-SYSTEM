<h4 class="page-title">Teacher Management</h4>

@if (error) { <div class="alert alert-danger">{{ error }}</div> }
@if (success) { <div class="alert alert-success">{{ success }}</div> }

<div class="row g-3">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <h6>{{ editingId ? 'Edit teacher' : 'Add teacher' }}</h6>
        <form (ngSubmit)="save()">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" [(ngModel)]="form.name" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" [(ngModel)]="form.email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Department</label>
            <input class="form-control" [(ngModel)]="form.department" name="department" required>
          </div>
          <button class="btn btn-primary me-2" type="submit">Save</button>
          @if (editingId) {
            <button class="btn btn-outline-secondary" type="button" (click)="reset()">Cancel</button>
          }
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (t of teachers; track t._id) {
              <tr>
                <td>{{ t.name }}</td>
                <td>{{ t.email }}</td>
                <td>{{ t.department }}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-1" (click)="edit(t)">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" (click)="remove(t)">Delete</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
