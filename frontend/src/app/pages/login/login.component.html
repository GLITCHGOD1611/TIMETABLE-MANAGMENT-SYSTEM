<div class="login-page">
  <div class="card login-card">
    <div class="card-body p-4">
      <h4 class="mb-1">Timetable Management System</h4>
      <p class="text-muted mb-4">Administrator sign in</p>
      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" [(ngModel)]="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" [(ngModel)]="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
      <p class="small text-muted mt-3 mb-0">Demo: admin&#64;college.edu / admin123</p>
    </div>
  </div>
</div>
